<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="112" fill="#0A0A0A"/>

  <!-- Subtle glow from top -->
  <rect width="512" height="280" rx="112" fill="url(#glowGrad)"/>

  <!-- Subtle inner border -->
  <rect x="20" y="20" width="472" height="472" rx="96"
        fill="none" stroke="#3B82F6" stroke-width="1.5" opacity="0.12"/>

  <!-- Bold V monogram -->
  <path d="M 148 152 L 256 380 L 364 152"
        fill="none"
        stroke="url(#vGrad)"
        stroke-width="60"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Small accent bar (tailoring reference) -->
  <rect x="226" y="428" width="60" height="6" rx="3"
        fill="#3B82F6" opacity="0.5"/>
</svg>