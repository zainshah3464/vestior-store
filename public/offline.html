<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0A0A0A" />
    <title>Offline · VESTIOR</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #0a0a0a;
        color: #fff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        text-align: center;
      }
      .icon {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: rgba(99, 102, 241, 0.1);
        border: 1px solid rgba(99, 102, 241, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 24px;
      }
      .icon svg {
        color: #818cf8;
      }
      h1 {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 12px;
      }
      p {
        color: #9ca3af;
        font-size: 14px;
        line-height: 1.6;
        margin-bottom: 8px;
      }
      .hint {
        color: #6b7280;
        font-size: 12px;
        margin-top: 20px;
        padding: 12px 16px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
      }
      button {
        margin-top: 24px;
        padding: 12px 24px;
        background: #6366f1;
        color: #fff;
        border: none;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s;
      }
      button:hover {
        background: #4f46e5;
      }
      .brand {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 1px;
        color: #3b82f6;
        margin-bottom: 32px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">VESTIOR</div>
      <div class="icon">
        <svg
          width="36"
          height="36"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>

      <h1>You're offline</h1>
      <p>
        Looks like you've lost your internet connection. Don't worry — we've
        saved some content for you.
      </p>

      <div class="hint">
        💡 When you reconnect, your cart and browsing history will sync
        automatically.
      </div>

      <button onclick="window.location.reload()">Try Again</button>
    </div>
  </body>
</html>
