<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0A0A0A" />
    <title>Offline · VESTIOR</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: #0a0a0a;
        color: #fff;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        position: relative;
        overflow: hidden;
      }

      /* ─────────────────────────────────────────────
          Ambient glow orbs (theme-matched)
         ───────────────────────────────────────────── */
      .orb {
        position: fixed;
        border-radius: 50%;
        pointer-events: none;
        filter: blur(120px);
        z-index: 0;
      }
      .orb-1 {
        top: -160px;
        left: 50%;
        transform: translateX(-50%);
        width: 700px;
        height: 400px;
        background: rgba(99, 102, 241, 0.08);
      }
      .orb-2 {
        top: 40%;
        right: -100px;
        width: 380px;
        height: 380px;
        background: rgba(59, 130, 246, 0.05);
        filter: blur(110px);
      }

      /* ─────────────────────────────────────────────
          Card
         ───────────────────────────────────────────── */
      .card {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 460px;
        text-align: center;
        padding: 40px 32px 36px;
        background: linear-gradient(180deg, #131313 0%, #0e0e0e 100%);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 24px;
        box-shadow:
          0 30px 80px -20px rgba(0, 0, 0, 0.8),
          0 0 0 1px rgba(255, 255, 255, 0.02) inset;
        animation: cardIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      @keyframes cardIn {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Top accent gradient line */
      .card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 24px;
        right: 24px;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(99, 102, 241, 0.6),
          transparent
        );
        border-radius: 1px;
      }

      /* ─────────────────────────────────────────────
          Brand
         ───────────────────────────────────────────── */
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.2em;
        color: #fff;
        margin-bottom: 28px;
        text-transform: uppercase;
      }

      .brand-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #3b82f6;
        box-shadow: 0 0 12px rgba(59, 130, 246, 0.8);
      }

      /* ─────────────────────────────────────────────
          Badge
         ───────────────────────────────────────────── */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 5px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        margin-bottom: 20px;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }

      .badge .dot {
        position: relative;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #f87171;
      }

      .badge .dot::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: #f87171;
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.7;
        }
        50% {
          transform: scale(2.2);
          opacity: 0;
        }
      }

      .badge span {
        font-size: 10px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-weight: 500;
        color: #9ca3af;
      }

      /* ─────────────────────────────────────────────
          Icon tile
         ───────────────────────────────────────────── */
      .icon-wrap {
        position: relative;
        width: 88px;
        height: 88px;
        margin: 0 auto 24px;
      }

      .icon-glow {
        position: absolute;
        inset: -8px;
        border-radius: 28px;
        background: radial-gradient(
          circle,
          rgba(99, 102, 241, 0.15) 0%,
          transparent 70%
        );
        filter: blur(16px);
        z-index: -1;
      }

      .icon {
        width: 88px;
        height: 88px;
        border-radius: 24px;
        background: linear-gradient(
          135deg,
          rgba(99, 102, 241, 0.15) 0%,
          rgba(139, 92, 246, 0.08) 100%
        );
        border: 1px solid rgba(99, 102, 241, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow:
          0 0 40px -12px rgba(99, 102, 241, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.05);
      }

      .icon svg {
        color: #818cf8;
      }

      /* ─────────────────────────────────────────────
          Typography
         ───────────────────────────────────────────── */
      h1 {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.15;
        color: #fff;
        margin-bottom: 12px;
      }

      p {
        color: #9ca3af;
        font-size: 14px;
        line-height: 1.6;
        max-width: 340px;
        margin: 0 auto;
      }

      /* ─────────────────────────────────────────────
          Hint card
         ───────────────────────────────────────────── */
      .hint {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin-top: 24px;
        padding: 14px 16px;
        text-align: left;
        background: rgba(59, 130, 246, 0.05);
        border: 1px solid rgba(59, 130, 246, 0.15);
        border-radius: 14px;
      }

      .hint-icon {
        flex-shrink: 0;
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: rgba(59, 130, 246, 0.12);
        border: 1px solid rgba(59, 130, 246, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #60a5fa;
      }

      .hint-text {
        font-size: 12px;
        line-height: 1.55;
        color: #cbd5e1;
        padding-top: 3px;
      }

      /* ─────────────────────────────────────────────
          Button
         ───────────────────────────────────────────── */
      .btn-wrap {
        position: relative;
        display: inline-block;
        margin-top: 28px;
      }

      button {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 13px 28px;
        background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
        color: #fff;
        border: none;
        border-radius: 14px;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.01em;
        cursor: pointer;
        overflow: hidden;
        box-shadow:
          0 10px 30px -10px rgba(99, 102, 241, 0.6),
          inset 0 1px 0 rgba(255, 255, 255, 0.12);
        transition:
          transform 0.2s cubic-bezier(0.22, 1, 0.36, 1),
          box-shadow 0.2s ease;
        font-family: inherit;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow:
          0 16px 40px -12px rgba(99, 102, 241, 0.75),
          inset 0 1px 0 rgba(255, 255, 255, 0.15);
      }

      button:active {
        transform: translateY(0);
      }

      /* Shine sweep on hover */
      button::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.18),
          transparent
        );
        transition: left 0.7s ease;
      }

      button:hover::before {
        left: 100%;
      }

      button svg {
        transition: transform 0.3s ease;
      }

      button:hover svg {
        transform: rotate(-90deg);
      }

      /* ─────────────────────────────────────────────
          Footer
         ───────────────────────────────────────────── */
      .footer {
        position: fixed;
        bottom: 20px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 10px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #4b5563;
        z-index: 1;
      }

      /* ─────────────────────────────────────────────
          Mobile tweaks
         ───────────────────────────────────────────── */
      @media (max-width: 480px) {
        .card {
          padding: 32px 22px 30px;
          border-radius: 20px;
        }
        h1 {
          font-size: 22px;
        }
        .icon,
        .icon-wrap {
          width: 76px;
          height: 76px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Ambient glow orbs -->
    <div class="orb orb-1" aria-hidden="true"></div>
    <div class="orb orb-2" aria-hidden="true"></div>

    <main class="card" role="main">
      <!-- Brand -->
      <div class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        VESTIOR
      </div>

      <!-- Status badge -->
      <div class="badge" role="status">
        <span class="dot" aria-hidden="true"></span>
        <span>No Connection</span>
      </div>

      <!-- Icon tile -->
      <div class="icon-wrap">
        <div class="icon-glow" aria-hidden="true"></div>
        <div class="icon">
          <svg
            width="36"
            height="36"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <line x1="2" y1="2" x2="22" y2="22"></line>
            <path d="M8.5 16.5a5 5 0 0 1 7 0"></path>
            <path d="M2 8.82a15 15 0 0 1 4.17-2.65"></path>
            <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"></path>
            <path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"></path>
            <path d="M5 12.55a10 10 0 0 1 5.17-2.39"></path>
            <line x1="12" y1="20" x2="12.01" y2="20"></line>
          </svg>
        </div>
      </div>

      <!-- Heading + description -->
      <h1>You&rsquo;re offline</h1>
      <p>
        Looks like you&rsquo;ve lost your internet connection. Don&rsquo;t
        worry &mdash; we&rsquo;ve saved some content for you.
      </p>

      <!-- Hint -->
      <div class="hint">
        <div class="hint-icon" aria-hidden="true">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2V17h6v-.3c0-.8.4-1.5 1-2A7 7 0 0 0 12 2z"
            ></path>
          </svg>
        </div>
        <div class="hint-text">
          When you reconnect, your cart and browsing history will sync
          automatically.
        </div>
      </div>

      <!-- Retry -->
      <div class="btn-wrap">
        <button onclick="window.location.reload()" aria-label="Try again">
          <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M21 12a9 9 0 1 1-3-6.7"></path>
            <path d="M21 3v6h-6"></path>
          </svg>
          Try Again
        </button>
      </div>
    </main>

    <div class="footer" aria-hidden="true">VESTIOR &middot; EST. 1968</div>
  </body>
</html>
